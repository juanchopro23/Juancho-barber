<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Juancho Barber">
<title>Juancho Delibery barber shop</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#10223f;--mut:#5b6980;--red:#c8102e;--line:#dde2ea;--stamp:#e8ecf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1526;--card:#14213a;--ink:#eef2f9;--mut:#9aa8c0;--red:#e5384f;--line:#273655;--stamp:#223250}}
*{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.pole{height:10px;background:repeating-linear-gradient(135deg,var(--red) 0 14px,#fff 14px 28px,#2a4d9b 28px 42px,#fff 42px 56px)}
header{padding:14px 20px 4px;text-align:center}
header img{width:132px;height:132px}
h2{font:400 22px/1.1 Anton,Impact,sans-serif;margin:0 0 10px}
main{padding:12px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.promo{border:2px dashed var(--red);border-radius:12px;padding:12px;margin-top:10px}
.promo p{margin:6px 0}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--red);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2a4d9b;outline-offset:2px}
.full{width:100%;margin-top:12px}
.big{font:400 56px/1 Anton,Impact,sans-serif;color:var(--red)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.stamp{aspect-ratio:1;border-radius:50%;background:var(--stamp);display:grid;place-items:center;font-weight:700;color:var(--mut);border:2px dashed var(--line)}
.stamp.on{background:var(--red);color:#fff;border:2px solid var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row small{color:var(--mut);display:block}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{padding:10px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.slot.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--stamp);display:inline-block}
.tag.ok{background:#1f8a4c;color:#fff}.tag.no{background:var(--mut);color:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:14px 4px}
nav button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.note{font-size:13px;color:var(--mut)}
.err{color:var(--red);font-weight:700;min-height:1.4em}
.ok-msg{color:#1f8a4c;font-weight:700}
.code{font:400 40px/1 Anton,Impact,sans-serif;letter-spacing:4px;text-align:center;padding:14px;border:2px dashed var(--red);border-radius:12px;margin:10px 0}
.two{display:flex;gap:8px;margin-top:8px}
#toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:50;padding:14px 16px;border-radius:12px;font-weight:700;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.3);display:none}
#toast.show{display:block}#toast.bad{background:#b00020}#toast.good{background:#1f8a4c}
.secerr{border:2px solid var(--red);border-radius:12px;padding:10px;margin-bottom:14px;color:var(--red);font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="pole"></div>
<header><img src="logo.svg" alt="Juancho Delibery barber shop"></header>
<div id="toast" role="status" aria-live="polite"></div>
<main id="app"></main>
<nav>
  <button id="t-card" onclick="go('card')">Mi tarjeta</button>
  <button id="t-book" onclick="go('book')">Agendar</button>
  <button id="t-own" onclick="go('own')">Dueño</button>
</nav>
<script src="config.js"></script>
<script>
var C=window.APP_CONFIG||{},tab="card",PHONE="",TOKEN="",SV=[],RW=[],PR=[],ME=null,AD=null,sel={svc:0,date:"",time:""},TAKEN=[],MSG="",OK="",AERR=[],CLEAR=[],BUSY=false,TT=0;
var HOURS=["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00"];
try{PHONE=localStorage.getItem("jb-phone")||""}catch(e){}
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function msgOf(d,s){var m=(d&&(d.message||d.msg||d.error_description))||"Algo salió mal. Intenta de nuevo.";
 if(/Invalid login/i.test(m))return "Correo o contraseña incorrectos.";
 if(/not confirmed/i.test(m))return "Ese correo no está confirmado en Supabase.";
 if(/foreign key/i.test(m))return "Eso ya tiene registros asociados y no se puede quitar.";
 if(/JWT|expired/i.test(m)&&s===401)return "Sesión vencida. Entra de nuevo.";
 return m}
async function sb(path,o){o=o||{};
 var h={apikey:C.key,"Content-Type":"application/json"};if(!o.anon&&TOKEN)h.Authorization="Bearer "+TOKEN;
 if(o.prefer)h.Prefer=o.prefer;
 var r;try{r=await fetch(C.url+path,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined})}catch(e){throw new Error("No se pudo conectar. Revisa tu internet.")}
 var t=await r.text(),d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){if(r.status===401&&TOKEN){TOKEN="";AD=null;throw new Error("Sesión vencida. Entra de nuevo.")}throw new Error(msgOf(d,r.status))}
 return d}
function rpc(fn,args){return sb("/rest/v1/rpc/"+fn,{method:"POST",body:args||{}})}
function setPhone(p){PHONE=p;try{localStorage.setItem("jb-phone",p)}catch(e){}}
function target(p){for(var i=0;i<RW.length;i++)if(RW[i].points>p)return RW[i];return RW[RW.length-1]}
function go(t){tab=t;MSG="";OK="";render()}
async function load(){
 var a=await Promise.all([sb("/rest/v1/services?select=*&order=id"),sb("/rest/v1/rewards?select=*&order=points"),
  sb("/rest/v1/promotions?select=id,title,body,bonus_points,multiplier,requires_code&active=eq.true&order=id.desc")]);
 SV=a[0];RW=a[1];PR=a[2];
 if(PHONE&&!ME){try{ME=await rpc("client_me",{p_phone:PHONE})}catch(e){setPhone("")}}
 if(tab==="book"&&sel.date){TAKEN=await rpc("taken_slots",{p_date:sel.date})||[]}
 if(tab==="own"&&TOKEN)AD=await loadAdmin()}
async function loadAdmin(){
 AERR=[];
 function q(label,path){return sb(path).then(function(d){return d||[]}).catch(function(e){if(!TOKEN)throw e;AERR.push(label+": "+e.message);return []})}
 var a=await Promise.all([
  q("Citas","/rest/v1/appointments?select=id,date,time,phone,clients(name),services(name)&status=eq.pendiente&order=date,time"),
  q("Canjes","/rest/v1/redemptions?select=*&used=eq.false&order=id"),
  q("Clientes","/rest/v1/clients?select=*&order=created_at.desc"),
  q("Promociones","/rest/v1/promotions?select=*&order=id.desc")]);
 return {appts:a[0],reds:a[1],clients:a[2],promos:a[3]}}
function snap(){var o={};document.querySelectorAll("#app input,#app textarea").forEach(function(e){if(e.id&&e.type!=="date")o[e.id]=e.value});return o}
function toast(){var t=$("toast");if(!t)return;var m=MSG||OK;clearTimeout(TT);if(!m){t.className="";t.textContent="";return}
 t.textContent=m;t.className="show "+(MSG?"bad":"good");TT=setTimeout(function(){t.className=""},MSG?10000:4000)}
async function render(quiet){
 ["card","book","own"].forEach(function(t){$("t-"+t).className=t===tab?"on":""});
 if(!C.url||C.url.indexOf("PEGA_")>-1){$("app").innerHTML='<div class="card"><h2>Falta configurar</h2><p>Abre el archivo config.js y pon la URL y la clave de Supabase.</p></div>';return}
 try{await load()}catch(e){MSG=e.message}
 var keep=snap(),y=window.scrollY||0;
 $("app").innerHTML=tab==="card"?vCard():tab==="book"?vBook():vOwn();
 for(var k in keep){var el=$(k);if(el&&CLEAR.indexOf(k)<0)el.value=keep[k]}
 CLEAR=[];if(window.scrollTo)window.scrollTo(0,y);
 if(!quiet)toast()}
async function act(fn,ok,clear){BUSY=true;try{MSG="";OK="";await fn();if(ok)OK=ok;CLEAR=clear||[]}catch(e){MSG=e.message||"Algo salió mal."}BUSY=false;render()}
function msgs(){return '<p class="err" role="alert">'+esc(MSG)+'</p>'+(OK?'<p class="ok-msg">'+esc(OK)+'</p>':'')}

function vPromos(){
 if(!PR.length)return "";
 var cl=ME?ME.claimed:[],h='<div class="card"><h2>Promociones</h2>';
 PR.forEach(function(p){var used=cl.indexOf(p.id)>-1;
  h+='<div class="promo"><strong>'+esc(p.title)+'</strong>'+(p.multiplier>1?' <span class="tag">Puntos ×'+p.multiplier+' activo</span>':'')+(p.body?'<p>'+esc(p.body)+'</p>':'');
  if(p.bonus_points>0){
   if(used)h+='<span class="tag ok">Ya usada</span>';
   else if(!ME)h+='<p class="note">Crea tu tarjeta para reclamar +'+p.bonus_points+' puntos.</p>';
   else h+=(p.requires_code?'<input id="pc'+p.id+'" placeholder="Escribe el código" aria-label="Código de la promoción">':'')+'<button class="full" onclick="claim('+p.id+','+(p.requires_code?1:0)+')">Reclamar +'+p.bonus_points+' puntos</button>'}
  h+='</div>'});
 return h+'</div>'}

function vCard(){
 if(!ME)return '<div class="card"><h2>Crea tu tarjeta</h2><label for="n">Nombre</label><input id="n" autocomplete="name"><label for="p">Teléfono</label><input id="p" type="tel" autocomplete="tel">'+msgs()+'<button class="full" onclick="signup()">Crear mi tarjeta</button></div><div class="card"><h2>¿Ya tienes tarjeta?</h2><label for="p2">Teléfono</label><input id="p2" type="tel"><button class="ghost full" onclick="signin()">Entrar</button></div>'+vPromos();
 var t=target(ME.points)||{points:1,name:""},f=Math.round(Math.min(ME.points/t.points,1)*10),st="";
 for(var i=1;i<=10;i++)st+='<div class="stamp'+(i<=f?" on":"")+'">'+(i<=f?"✓":i)+'</div>';
 var left=Math.max(t.points-ME.points,0);
 var h='<div class="card"><p class="note">Hola, '+esc(ME.name)+'</p><div class="big">'+ME.points+'</div><div>puntos acumulados</div><div class="stamps">'+st+'</div><strong>'+(left>0?"Te faltan "+left+" puntos para: "+esc(t.name):"¡Ya puedes canjear: "+esc(t.name)+"!")+'</strong></div>'+msgs()+vPromos();
 h+='<div class="card"><h2>Recompensas</h2>';
 RW.forEach(function(r){h+='<div class="row"><div><strong>'+esc(r.name)+'</strong><small>'+r.points+' puntos</small></div><button '+(ME.points>=r.points?"":"disabled")+' onclick="redeem('+r.id+')">Canjear</button></div>'});
 h+='</div><div class="card"><h2>Mis citas</h2>';
 if(!ME.appts.length)h+='<p class="note">Aún no tienes citas. Ve a Agendar para reservar la primera.</p>';
 ME.appts.forEach(function(a){h+='<div class="row"><div><strong>'+esc(a.service)+'</strong><small>'+a.date+' · '+a.time+'</small></div><span class="tag '+(a.status==="completada"?"ok":a.status==="cancelada"?"no":"")+'">'+a.status+'</span></div>'});
 return h+'<button class="ghost full" onclick="logout()">Salir</button></div>'}
function signup(){act(async function(){var p=await rpc("client_signup",{p_name:$("n").value,p_phone:$("p").value});setPhone(p);ME=await rpc("client_me",{p_phone:p})})}
function signin(){act(async function(){var p=$("p2").value.replace(/\D/g,"");ME=await rpc("client_me",{p_phone:p});setPhone(p)})}
function logout(){setPhone("");ME=null;render()}
function claim(id,needs){act(async function(){var c=needs?$("pc"+id).value:null;var n=await rpc("claim_promo",{p_phone:PHONE,p_promo:id,p_code:c});ME=await rpc("client_me",{p_phone:PHONE});OK="¡Listo! Ganaste "+n+" puntos."})}
async function redeem(id){try{var d=await rpc("redeem_reward",{p_phone:PHONE,p_reward:id});ME=await rpc("client_me",{p_phone:PHONE});
 $("app").innerHTML='<div class="card"><h2>Canje listo</h2><p>Muestra este código en la barbería para recibir: <strong>'+esc(d.reward)+'</strong></p><div class="code">'+d.code+'</div><button class="full" onclick="go(\'card\')">Volver a mi tarjeta</button></div>'}catch(e){MSG=e.message;render()}}

function vBook(){
 if(!ME)return '<div class="card"><h2>Primero crea tu tarjeta</h2><p>Así guardamos tu cita y tus puntos.</p><button class="full" onclick="go(\'card\')">Crear mi tarjeta</button></div>';
 var h='<div class="card"><h2>Agenda tu cita</h2><label for="sv">Servicio</label><select id="sv" onchange="sel.svc=+this.value"><option value="">Elige un servicio</option>';
 SV.forEach(function(s){h+='<option value="'+s.id+'"'+(sel.svc===s.id?" selected":"")+'>'+esc(s.name)+' · $'+s.price+' · +'+s.points+' pts</option>'});
 h+='</select><label for="dt">Día</label><input id="dt" type="date" min="'+today()+'" value="'+sel.date+'" onchange="sel.date=this.value;sel.time=\'\';render()"><label>Hora</label><div class="slots">';
 if(!sel.date)h+='<p class="note" style="grid-column:1/-1">Elige un día para ver los horarios libres.</p>';
 else HOURS.forEach(function(t){var off=TAKEN.indexOf(t)>-1;h+='<button class="slot'+(sel.time===t?" sel":"")+'" '+(off?"disabled":"")+' onclick="sel.time=\''+t+'\';render()">'+t+'</button>'});
 return h+'</div>'+msgs()+'<button class="full" onclick="book()">Confirmar cita</button></div>'}
function book(){act(async function(){
 if(!sel.svc||!sel.date||!sel.time)throw new Error("Elige servicio, día y hora.");
 await rpc("book_appointment",{p_phone:PHONE,p_service:sel.svc,p_date:sel.date,p_time:sel.time});
 sel={svc:0,date:"",time:""};TAKEN=[];ME=await rpc("client_me",{p_phone:PHONE});tab="card";OK="Cita confirmada. Te esperamos."})}

function vOwn(){
 if(!TOKEN)return '<div class="card"><h2>Panel del dueño</h2><label for="em">Correo</label><input id="em" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">'+msgs()+'<button class="full" onclick="login()">Entrar</button></div>';
 if(!AD)return '<div class="card"><h2>Panel del dueño</h2><p class="note">No se pudo cargar el panel.</p>'+msgs()+'<button class="full" onclick="act(function(){})">Reintentar</button><button class="ghost full" onclick="TOKEN=\'\';AD=null;render()">Salir</button></div>';
 var h=msgs();
 if(AERR.length)h+='<div class="secerr">No se pudo cargar:<br>'+AERR.map(esc).join('<br>')+'</div>';
 h+='<div class="card"><h2>Citas pendientes</h2>';
 if(!AD.appts.length)h+='<p class="note">No hay citas pendientes.</p>';
 AD.appts.forEach(function(a){h+='<div class="row"><div><strong>'+esc(a.clients?a.clients.name:a.phone)+'</strong><small>'+esc(a.services?a.services.name:"")+' · '+a.date+' · '+a.time+'</small></div><div><button onclick="complete('+a.id+')">Completar</button> <button class="ghost" onclick="patch(\'appointments\','+a.id+',{status:\'cancelada\'})">Cancelar</button></div></div>'});
 h+='</div><div class="card"><h2>Canjes por entregar</h2>';
 if(!AD.reds.length)h+='<p class="note">No hay canjes pendientes.</p>';
 AD.reds.forEach(function(r){h+='<div class="row"><div><strong>'+esc(r.reward_name)+'</strong><small>Código '+esc(r.code)+' · '+esc(r.phone)+'</small></div><button onclick="patch(\'redemptions\','+r.id+',{used:true})">Entregado</button></div>'});
 h+='</div><div class="card"><h2>Promociones</h2>';
 AD.promos.forEach(function(p){h+='<div class="row"><div><strong>'+esc(p.title)+'</strong><small>'+(p.active?"Activa":"Pausada")+(p.bonus_points?" · +"+p.bonus_points+" pts":"")+(p.multiplier>1?" · ×"+p.multiplier:"")+(p.code?" · código "+esc(p.code):"")+'</small></div><div><button class="ghost" onclick="patch(\'promotions\','+p.id+',{active:'+(!p.active)+'})">'+(p.active?"Pausar":"Activar")+'</button> <button class="ghost" onclick="del(\'promotions\','+p.id+')">Quitar</button></div></div>'});
 h+='<label for="pt">Nueva promoción</label><input id="pt" placeholder="Título. Ej. Martes de puntos dobles"><textarea id="pb" rows="2" placeholder="Descripción para el cliente" style="margin-top:8px"></textarea><div class="two"><input id="pbp" type="number" placeholder="Puntos de regalo"><input id="pm" type="number" placeholder="Multiplicador (2 = doble)"></div><input id="pcd" placeholder="Código (opcional)" style="margin-top:8px"><button class="full" onclick="addPromo()">Crear promoción</button><p class="note">Puntos de regalo: cada cliente los reclama una vez. Multiplicador: suma más puntos al completar citas mientras la promo esté activa.</p></div>';
 h+='<div class="card"><h2>Servicios</h2>';
 SV.forEach(function(s){h+='<div class="row"><div><strong>'+esc(s.name)+'</strong><small>$'+s.price+' · '+s.points+' puntos</small></div><button class="ghost" onclick="del(\'services\','+s.id+')">Quitar</button></div>'});
 h+='<label for="sn">Nuevo servicio</label><input id="sn" placeholder="Nombre"><div class="two"><input id="sp" type="number" placeholder="Precio"><input id="sq" type="number" placeholder="Puntos"></div><button class="full" onclick="addSvc()">Agregar servicio</button></div><div class="card"><h2>Recompensas</h2>';
 RW.forEach(function(r){h+='<div class="row"><div><strong>'+esc(r.name)+'</strong><small>'+r.points+' puntos</small></div><button class="ghost" onclick="del(\'rewards\','+r.id+')">Quitar</button></div>'});
 h+='<label for="rn">Nueva recompensa</label><input id="rn" placeholder="Ej. Combo gratis"><input id="rp" type="number" placeholder="Puntos necesarios" style="margin-top:8px"><button class="full" onclick="addRw()">Agregar recompensa</button></div><div class="card"><h2>Clientes ('+AD.clients.length+')</h2>';
 if(!AD.clients.length)h+='<p class="note">Todavía no hay clientes registrados.</p>';
 AD.clients.forEach(function(c){var f="";try{f=c.created_at?new Date(c.created_at).toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"}):""}catch(e){}
  h+='<div class="row"><div><strong>'+esc(c.name)+'</strong><small>'+esc(c.phone)+(f?' · registrado '+f:'')+'</small></div><strong>'+c.points+' pts</strong></div>'});
 return h+'<button class="full" onclick="act(function(){},\'Lista actualizada.\')">Actualizar lista</button><button class="ghost full" onclick="TOKEN=\'\';AD=null;render()">Cerrar panel</button></div>'}
function login(){act(async function(){
 var em=$("em").value.trim().toLowerCase(),pw=$("pw").value;
 if(!em||!pw)throw new Error("Escribe tu correo y tu contraseña.");
 var d=await sb("/auth/v1/token?grant_type=password",{method:"POST",anon:true,body:{email:em,password:pw}});
 TOKEN=d.access_token;
 var ok=true;try{ok=await rpc("is_admin")}catch(e){}
 if(ok===false){TOKEN="";throw new Error("Entraste, pero este correo no tiene permiso de dueño.")}
 OK="Bienvenido."})}
function complete(id){act(function(){return rpc("complete_appointment",{p_id:id})},"Cita completada. Puntos sumados.")}
function patch(t,id,b){act(function(){return sb("/rest/v1/"+t+"?id=eq."+id,{method:"PATCH",body:b,prefer:"return=minimal"})},"Guardado.")}
function del(t,id){act(function(){return sb("/rest/v1/"+t+"?id=eq."+id,{method:"DELETE",prefer:"return=minimal"})},"Quitado.")}
function ins(t,b,m,clear){act(function(){return sb("/rest/v1/"+t,{method:"POST",body:b,prefer:"return=minimal"})},m,clear)}
function warn(m){MSG=m;OK="";render()}
function addSvc(){var n=$("sn").value.trim(),p=+$("sp").value,q=parseInt($("sq").value,10);if(!n||$("sp").value===""||!(p>=0)||!(q>=0)){return warn("Completa nombre, precio y puntos.")}ins("services",{name:n,price:p,points:q},"Servicio agregado.",["sn","sp","sq"])}
function addRw(){var n=$("rn").value.trim(),p=parseInt($("rp").value,10);if(!n||!(p>0)){return warn("Completa nombre y puntos.")}ins("rewards",{name:n,points:p},"Recompensa agregada.",["rn","rp"])}
function addPromo(){var t=$("pt").value.trim();if(!t){return warn("Escribe un título.")}
